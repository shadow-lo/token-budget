[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-budget"
version = "0.1.0"
description = "Scan a folder, estimate its LLM token count, and see whether it fits a context window."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "shadow-lo" }]
keywords = ["llm", "tokens", "context-window", "cli", "ai"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.5"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/shadow-lo/token-budget"

[project.scripts]
token-budget = "token_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=token_budget --cov-report=term-missing --cov-fail-under=80"
